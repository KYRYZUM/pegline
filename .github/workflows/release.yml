name: Release

# Pushing a tag such as v0.2.0 builds the installer and publishes it as a GitHub release,
# which installed copies of Pegline find on their hourly update check.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test --configuration Release
      - name: Visual search models
        shell: pwsh
        run: ./scripts/prepare-search-models.ps1
      - name: Previous release, for delta updates
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet tool restore
          dotnet vpk download github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir Releases
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./scripts/pack.ps1 -Version $version
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet vpk upload github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir Releases --publish --tag "${{ github.ref_name }}" --releaseName "Pegline $version"
